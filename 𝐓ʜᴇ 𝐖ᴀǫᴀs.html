<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝐓ʜᴇ 𝐖ᴀǫᴀs PAK SIM DATABASES</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --accent-green: #10b981;
            --accent-green-dark: #059669;
            --accent-green-light: #d1fae5;
            --border-color: #e5e7eb;
            --danger: #ef4444;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
            --shadow-lg: 0 20px 40px -10px rgba(16, 185, 129, 0.15), 0 10px 20px -10px rgba(0,0,0,0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- Top Nav --- */
        .top-nav {
            background: #ffffff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: var(--shadow-sm);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-icon {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-green-dark));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 20px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .brand-text h1 {
            font-size: 1.1rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px;
        }
        .brand-text p {
            font-size: 0.7rem; color: var(--accent-green); font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
        }
        .social-links { display: flex; gap: 8px; }
        .social-btn {
            width: 38px; height: 38px;
            border-radius: 10px;
            background: var(--bg-main);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted);
            text-decoration: none; font-size: 16px;
            transition: 0.3s; border: 1px solid var(--border-color);
        }
        .social-btn:hover {
            background: var(--accent-green-light); color: var(--accent-green-dark); border-color: var(--accent-green);
        }

        /* --- Main Content --- */
        .main-wrapper {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }

        /* --- Search Box --- */
        .search-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: var(--shadow-lg);
            border: 1px solid #ffffff;
            position: relative;
            overflow: hidden;
            text-align: center;
            margin-bottom: 30px;
            transition: transform 0.3s ease;
        }
        .search-card:hover {
            transform: translateY(-2px);
        }
        .search-card::before {
            content: '';
            position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--accent-green), #3b82f6);
        }
        .search-card h2 {
            font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; color: var(--text-main);
        }
        .search-card h2 span { color: var(--accent-green); }
        .search-card p {
            color: var(--text-muted); font-size: 0.95rem; margin-bottom: 30px;
        }

        .input-area {
            display: flex;
            align-items: center;
            background: var(--bg-main);
            border-radius: 16px;
            padding: 6px;
            border: 2px solid transparent;
            transition: 0.3s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .input-area:focus-within {
            border-color: var(--accent-green);
            background: #ffffff;
            box-shadow: 0 0 0 4px var(--accent-green-light);
        }
        .input-area i {
            font-size: 20px; color: var(--text-muted); margin: 0 15px;
        }
        .input-area input {
            flex: 1; border: none; background: transparent; outline: none;
            font-family: var(--font-mono); font-size: 1.1rem; font-weight: 700;
            color: var(--text-main); padding: 12px 0; letter-spacing: 1px;
        }
        .input-area input::placeholder { color: #9ca3af; font-weight: 400; }
        .btn-search {
            background: linear-gradient(135deg, var(--accent-green), var(--accent-green-dark));
            color: #ffffff; border: none; border-radius: 12px;
            padding: 14px 28px; font-size: 1rem; font-weight: 700; cursor: pointer;
            transition: 0.3s; display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }
        .btn-search:disabled {
            opacity: 0.7; cursor: not-allowed; transform: none;
        }

        /* --- Loader --- */
        .loader-box {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 40px 0;
            gap: 15px;
        }
        .loader-box.active { display: flex; }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid var(--accent-green-light);
            border-top-color: var(--accent-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-box p {
            color: var(--accent-green-dark); font-weight: 600; font-size: 0.9rem;
            animation: pulseText 1.5s infinite;
        }
        @keyframes pulseText { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* --- Results Area --- */
        .results-container {
            display: flex; flex-direction: column; gap: 20px;
        }

        .result-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            animation: slideUp 0.4s ease forwards;
            opacity: 0;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-top {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px dashed var(--border-color);
        }
        .card-top h3 {
            font-size: 1.1rem; font-weight: 800; color: var(--text-main);
            display: flex; align-items: center; gap: 8px;
        }
        .card-top h3 i { color: var(--accent-green); }
        .copy-btn {
            background: var(--bg-main); border: 1px solid var(--border-color);
            padding: 8px 16px; border-radius: 8px;
            font-size: 0.8rem; font-weight: 700; color: var(--text-muted);
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 6px;
        }
        .copy-btn:hover {
            background: var(--accent-green-light); color: var(--accent-green-dark); border-color: var(--accent-green);
        }

        .data-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
        }
        @media (max-width: 600px) { .data-grid { grid-template-columns: 1fr; } }

        .data-box {
            background: var(--bg-main); border-radius: 12px; padding: 15px;
            position: relative; border: 1px solid transparent; transition: 0.2s;
        }
        .data-box:hover { border-color: var(--accent-green-light); background: #ffffff; box-shadow: var(--shadow-sm); }
        .data-box.full-width { grid-column: 1 / -1; }

        .label-row {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
        }
        .label-row span {
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--text-muted); font-weight: 700;
        }
        .mini-copy {
            color: #9ca3af; cursor: pointer; transition: 0.2s; font-size: 0.85rem;
        }
        .mini-copy:hover { color: var(--accent-green); }

        .value-text {
            font-family: var(--font-mono); font-size: 1rem; font-weight: 700; color: var(--text-main);
            word-break: break-word;
        }
        .value-text.highlight { color: var(--accent-green-dark); }

        .copy-all-wrapper { margin-bottom: 15px; display: none; }
        .copy-all-wrapper.show { display: block; }
        .btn-copy-all {
            width: 100%; padding: 15px; background: #ffffff; border: 2px solid var(--accent-green);
            color: var(--accent-green-dark); border-radius: 12px; font-size: 1rem; font-weight: 800;
            cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px;
            box-shadow: var(--shadow-sm);
        }
        .btn-copy-all:hover { background: var(--accent-green); color: #ffffff; box-shadow: var(--shadow-md); }

        /* --- Empty State --- */
        .empty-state {
            text-align: center; padding: 50px 20px; color: var(--text-muted);
            background: var(--card-bg); border-radius: 20px; box-shadow: var(--shadow-sm);
            border: 1px dashed #d1d5db;
        }
        .empty-state i { font-size: 3rem; color: #d1d5db; margin-bottom: 15px; }
        .empty-state h3 { color: var(--text-main); font-size: 1.2rem; margin-bottom: 5px; }
        .empty-state p { font-size: 0.9rem; }
        .empty-state.error { border-color: #fca5a5; background: #fef2f2; }
        .empty-state.error i { color: var(--danger); }
        .empty-state.error h3 { color: var(--danger); }

        /* --- Footer --- */
        footer {
            text-align: center; padding: 25px; color: var(--text-muted); font-size: 0.85rem;
            border-top: 1px solid var(--border-color); background: #ffffff; margin-top: auto;
        }
        footer strong { color: var(--accent-green-dark); font-weight: 800; }

        /* --- Toast --- */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translate(-50%, 150px);
            background: #1f2937; color: #ffffff; padding: 12px 24px; border-radius: 50px;
            font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); opacity: 0; transition: 0.4s; z-index: 1000;
            pointer-events: none;
        }
        .toast.show { transform: translate(-50%, 0); opacity: 1; }
        .toast i { color: var(--accent-green); }
        .toast.error i { color: var(--danger); }

        /* --- Floating WP --- */
        .float-wa {
            position: fixed; bottom: 30px; right: 30px;
            width: 60px; height: 60px; background: #25D366; color: #ffffff;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 30px; text-decoration: none; z-index: 100;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
            transition: 0.3s;
        }
        .float-wa:hover { transform: scale(1.1) translateY(-5px); box-shadow: 0 15px 35px rgba(37, 211, 102, 0.4); }

    </style>
</head>
<body>

<!-- Top Nav -->
<div class="top-nav">
    <div class="brand">
        <div class="brand-icon"><i class="fas fa-sim-card"></i></div>
        <div class="brand-text">
            <h1>ROMAN SIM</h1>
            <p>DATABASE</p>
        </div>
    </div>
    <div class="social-links">
        <a href="https://whatsapp.com/channel/0029VawwXaeEquiIR1CLXA30" target="_blank" class="social-btn" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
        <a href="https://t.me/romanhacker2" target="_blank" class="social-btn" title="Telegram"><i class="fab fa-telegram-plane"></i></a>
    </div>
</div>

<!-- Main Area -->
<main class="main-wrapper">
    
    <!-- Search Card -->
    <div class="search-card">
        <h2>Search <span>SIM Data</span></h2>
        <p>Enter 11-digit number or 13-digit CNIC to get instant details</p>
        <div class="input-area">
            <i class="fas fa-search"></i>
            <input type="tel" id="simInput" placeholder="03XXXXXXXXX" maxlength="13" autocomplete="off">
            <button id="searchBtn" class="btn-search"><i class="fas fa-bolt"></i> SEARCH</button>
        </div>
    </div>

    <!-- Loader -->
    <div class="loader-box" id="loaderBox">
        <div class="spinner"></div>
        <p>Fetching Data...</p>
    </div>

    <!-- Copy All Button -->
    <div class="copy-all-wrapper" id="copyAllWrapper">
        <button class="btn-copy-all" onclick="copyAllRecords()">
            <i class="fas fa-copy"></i> COPY ALL RECORDS
        </button>
    </div>

    <!-- Results -->
    <div class="results-container" id="resultsContainer">
        <div class="empty-state" id="emptyState">
            <i class="fas fa-database"></i>
            <h3>Ready to Search</h3>
            <p>Enter a number above to begin.</p>
        </div>
    </div>

</main>

<!-- Footer -->
<footer>
    &copy; 2026 <strong>ROMAN SIM DATABASE</strong>. All Rights Reserved.
</footer>

<!-- Floating WP -->
<a href="https://wa.me/923037224620" target="_blank" class="float-wa"><i class="fab fa-whatsapp"></i></a>

<!-- Toast -->
<div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg"></span></div>

<script>
    // ================= API CONFIG =================
    const API_URL = 'https://nexgen-tech-sim-api-v-01.vercel.app/api/search?number=';
    // ==============================================

    const input = document.getElementById('simInput');
    const searchBtn = document.getElementById('searchBtn');
    const loader = document.getElementById('loaderBox');
    const results = document.getElementById('resultsContainer');
    const copyAllWrapper = document.getElementById('copyAllWrapper');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');

    let allRecords = [];

    // Toast Notification
    function showToast(msg, isError = false) {
        toastMsg.textContent = msg;
        toast.className = 'toast show' + (isError ? ' error' : '');
        toast.querySelector('i').className = isError ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Copy Function
    function copyText(text, btn = null) {
        navigator.clipboard.writeText(text).then(() => {
            showToast('Copied to clipboard!');
            if(btn) {
                const orig = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Copied';
                btn.style.color = 'var(--accent-green-dark)';
                btn.style.borderColor = 'var(--accent-green)';
                setTimeout(() => {
                    btn.innerHTML = orig;
                    btn.style.color = '';
                    btn.style.borderColor = '';
                }, 1500);
            }
        }).catch(() => showToast('Failed to copy', true));
    }

    // Main Search Function
    async function performSearch() {
        let query = input.value.trim();
        if(!query || (query.length !== 11 && query.length !== 13)) {
            showToast('Please enter a valid 11-digit number or 13-digit CNIC', true);
            return;
        }

        // Auto-format to 92 format if starts with 0
        let apiQuery = query;
        if(query.startsWith('0')) {
            apiQuery = '92' + query.substring(1);
        }

        // UI Reset
        loader.classList.add('active');
        results.innerHTML = '';
        copyAllWrapper.classList.remove('show');
        searchBtn.disabled = true;
        allRecords = [];

        try {
            const res = await fetch(API_URL + apiQuery);
            const json = await res.json();

            // Check response structure from Nexgen API
            if(json.status === 'success' && json.result && json.result.sim_data && json.result.sim_data.length > 0) {
                
                const simData = json.result.sim_data;
                const truecallerData = json.result.truecaller_data || [];
                
                // Merge Truecaller name if available
                simData.forEach(rec => {
                    const tc = truecallerData.find(t => t.number === rec.number);
                    if(tc && tc.name && (!rec.name || rec.name === 'N/A')) {
                        rec.name = tc.name;
                    }
                });

                allRecords = simData;
                renderResults(simData);
                showToast('Data loaded successfully!');

            } else if(json.status === 'success' && json.result && json.result.sim_data && json.result.sim_data.length === 0) {
                results.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-search-minus"></i>
                    <h3>No Data Found</h3>
                    <p>No record found for <b>${query}</b>.</p>
                </div>`;
                showToast('No record found', true);
            } else {
                throw new Error(json.message || 'Invalid response format');
            }

        } catch (err) {
            console.error(err);
            results.innerHTML = `
            <div class="empty-state error">
                <i class="fas fa-wifi"></i>
                <h3>Connection Error</h3>
                <p>Server is busy or API limit reached. Please try again.</p>
            </div>`;
            showToast('Failed to fetch data', true);
        } finally {
            loader.classList.remove('active');
            searchBtn.disabled = false;
        }
    }

    // Render Results
    function renderResults(data) {
        let html = '';
        data.forEach((rec, idx) => {
            const num = rec.number || 'N/A';
            const name = rec.name || 'N/A';
            const cnic = rec.cnic || 'N/A';
            const address = rec.address || 'N/A';
            const net = rec.network || 'Unknown';

            html += `
            <div class="result-card" style="animation-delay: ${idx * 0.1}s">
                <div class="card-top">
                    <h3><i class="fas fa-id-badge"></i> Record #${idx + 1}</h3>
                    <button class="copy-btn" onclick="copySingle(this, '${name.replace(/'/g, "\\'")}', '${num}', '${cnic}', '${address.replace(/'/g, "\\'")}')">
                        <i class="fas fa-copy"></i> Copy
                    </button>
                </div>
                <div class="data-grid">
                    <div class="data-box">
                        <div class="label-row">
                            <span>Mobile Number</span>
                            <i class="fas fa-copy mini-copy" onclick="copyText('${num}', this)"></i>
                        </div>
                        <div class="value-text highlight">${num}</div>
                    </div>
                    <div class="data-box">
                        <div class="label-row">
                            <span>Network</span>
                        </div>
                        <div class="value-text">${net}</div>
                    </div>
                    <div class="data-box">
                        <div class="label-row">
                            <span>CNIC Number</span>
                            <i class="fas fa-copy mini-copy" onclick="copyText('${cnic}', this)"></i>
                        </div>
                        <div class="value-text">${cnic}</div>
                    </div>
                    <div class="data-box">
                        <div class="label-row">
                            <span>Owner Name</span>
                            <i class="fas fa-copy mini-copy" onclick="copyText('${name.replace(/'/g, "\\'")}', this)"></i>
                        </div>
                        <div class="value-text">${name}</div>
                    </div>
                    <div class="data-box full-width">
                        <div class="label-row">
                            <span>Address</span>
                            <i class="fas fa-copy mini-copy" onclick="copyText('${address.replace(/'/g, "\\'")}', this)"></i>
                        </div>
                        <div class="value-text">${address}</div>
                    </div>
                </div>
            </div>`;
        });

        results.innerHTML = html;
        copyAllWrapper.classList.add('show');
    }

    // Copy Single Record
    window.copySingle = function(btn, name, num, cnic, addr) {
        const text = `━━━━━━━━━━━━━━━\n*𝐓ʜᴇ 𝐖ᴀǫᴀs SIM DATABASE*\n━━━━━━━━━━━━━━━\n📱 Number : ${num}\n🆔 CNIC   : ${cnic}\n👤 Name   : ${name}\n📍 Address: ${addr}\n━━━━━━━━━━━━━━━`;
        copyText(text, btn);
    };

    // Copy All Records
    window.copyAllRecords = function() {
        if(allRecords.length === 0) return;
        let text = `━━━━━━━━━━━━━━━━━━━━━\n   ROMAN SIM DATABASES\n━━━━━━━━━━━━━━━━━━━━━\n\n`;
        allRecords.forEach((r, i) => {
            text += `📋 RECORD #${i + 1}\n📱 Number : ${r.number || 'N/A'}\n🆔 CNIC   : ${r.cnic || 'N/A'}\n👤 Name   : ${r.name || 'N/A'}\n📍 Address: ${r.address || 'N/A'}\n─────────────────────\n`;
        });
        text += `\n✅ Via 𝐓ʜᴇ 𝐖ᴀǫᴀs SIM DATABASES`;
        copyText(text);
    };

    // Event Listeners
    searchBtn.addEventListener('click', performSearch);
    input.addEventListener('keypress', (e) => {
        if(e.key === 'Enter') performSearch();
    });

</script>
</body>
</html>
